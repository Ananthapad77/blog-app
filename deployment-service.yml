# Replace YOUR_DOCKERHUB_USER/YOUR_REPO with the image your pipeline pushes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-app
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-app
  template:
    metadata:
      labels:
        app: blog-app
    spec:
      imagePullSecrets:
        - name: regcred          # remove this block if your DockerHub repo is public
      containers:
        - name: blog-app
          image: YOUR_DOCKERHUB_USER/YOUR_REPO:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              memory: "640Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blog-app-service
  namespace: webapps
spec:
  type: LoadBalancer
  selector:
    app: blog-app
  ports:
    - port: 80
      targetPort: 8080
